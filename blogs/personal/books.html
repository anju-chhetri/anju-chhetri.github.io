  <div class="book-grid" id="books"></div>

</div>

<script>
const myBooks = [
  "Brave New World",
  "80,000 Hours",
  "Guns, Germs, and Steel ",
  "The Alignment Problem",
  "48 Laws of Power",
  "The Alchemist",
  "Deep Work",
  "Think Like a monk"
];

// Fetch book data from Open Library
async function fetchBook(title) {
  const res = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}`);
  const data = await res.json();

  const book = data.docs[0]; // best match

  if (!book) return null;

  const coverId = book.cover_i;

  return {
    title: book.title,
    author: book.author_name ? book.author_name[0] : "Unknown",
    cover: coverId
      ? `https://covers.openlibrary.org/b/id/${coverId}-L.jpg`
      : "https://via.placeholder.com/200x300?text=No+Cover"
  };
}

// Render books
async function loadBooks() {
  const container = document.getElementById("books");

  for (const title of myBooks) {
    const book = await fetchBook(title);

    if (!book) continue;

    container.innerHTML += `
      <div class="book">
        <img src="${book.cover}" alt="${book.title}">
        <div class="title">${book.title}</div>
        <div style="font-size:12px; opacity:0.7">${book.author}</div>
      </div>
    `;
  }
}

loadBooks();
</script>
  </div>


<button class="back-button" onclick="history.back()">← Back</button>
